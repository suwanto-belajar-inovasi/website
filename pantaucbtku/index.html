<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CBT Pro Analytics Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .glass-panel { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .glow-text { text-shadow: 0 0 15px rgba(255, 255, 255, 0.3); }
        .loader { border-top-color: #06b6d4; animation: spinner 1s linear infinite; }
        @keyframes spinner { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="bg-slate-900 text-slate-200 min-h-screen selection:bg-cyan-500 selection:text-white">

    <!-- Header -->
    <nav class="border-b border-slate-700 bg-slate-900/80 sticky top-0 z-50 backdrop-blur-md">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-2xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-fuchsia-500">
                <i class="fas fa-satellite-dish text-cyan-400 mr-2"></i> CBT Radar X-Pro
            </h1>
            <div class="flex items-center gap-3">
                <span class="animate-pulse h-3 w-3 rounded-full bg-emerald-400"></span>
                <span class="text-slate-300 text-sm font-semibold tracking-wider uppercase">Live Traffic Monitor</span>
            </div>
        </div>
    </nav>

    <div class="max-w-7xl mx-auto px-4 py-8">
        
        <!-- Highlight Cards -->
        <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-8">
            <div class="glass-panel rounded-2xl p-6 relative overflow-hidden group">
                <div class="absolute -right-6 -top-6 bg-cyan-500/20 w-24 h-24 rounded-full blur-2xl group-hover:bg-cyan-500/40 transition"></div>
                <h3 class="text-slate-400 text-xs font-bold uppercase tracking-wider mb-2">Total Klien Aktif</h3>
                <p class="text-4xl font-black text-white glow-text" id="totalKlien">0</p>
            </div>
            
            <div class="glass-panel rounded-2xl p-6 relative overflow-hidden bg-gradient-to-br from-indigo-900/50 to-slate-900">
                <div class="flex items-center justify-between">
                    <div>
                        <h3 class="text-indigo-300 text-xs font-bold uppercase tracking-wider mb-1">Total Users (Peserta)</h3>
                        <p class="text-3xl font-bold text-indigo-100" id="globalUsers">0</p>
                    </div>
                    <i class="fas fa-users text-3xl text-indigo-500/50"></i>
                </div>
            </div>

            <div class="glass-panel rounded-2xl p-6 relative overflow-hidden bg-gradient-to-br from-fuchsia-900/50 to-slate-900">
                <div class="flex items-center justify-between">
                    <div>
                        <h3 class="text-fuchsia-300 text-xs font-bold uppercase tracking-wider mb-1">Total Soal (Exams)</h3>
                        <p class="text-3xl font-bold text-fuchsia-100" id="globalExams">0</p>
                    </div>
                    <i class="fas fa-file-alt text-3xl text-fuchsia-500/50"></i>
                </div>
            </div>

            <div class="glass-panel rounded-2xl p-6 relative overflow-hidden bg-gradient-to-br from-emerald-900/50 to-slate-900">
                <div class="flex items-center justify-between">
                    <div>
                        <h3 class="text-emerald-300 text-xs font-bold uppercase tracking-wider mb-1">Total Hasil (Results)</h3>
                        <p class="text-3xl font-bold text-emerald-100" id="globalResults">0</p>
                    </div>
                    <i class="fas fa-chart-bar text-3xl text-emerald-500/50"></i>
                </div>
            </div>
        </div>

        <!-- Main Data Table -->
        <div class="glass-panel rounded-2xl overflow-hidden shadow-2xl">
            <div class="px-6 py-5 border-b border-slate-700/50 flex flex-col md:flex-row justify-between items-center bg-slate-800/50">
                <h2 class="text-lg font-bold text-white mb-4 md:mb-0">Peringkat Trafik Penggunaan Klien</h2>
                <button onclick="fetchData()" class="bg-gradient-to-r from-cyan-500 to-blue-500 hover:from-cyan-400 hover:to-blue-400 text-white font-bold py-2 px-6 rounded-full shadow-lg shadow-cyan-500/30 transition-all transform hover:scale-105 active:scale-95">
                    <i class="fas fa-radar mr-2"></i> Scan Trafik Terbaru
                </button>
            </div>
            
            <!-- Loading State -->
            <div id="loader" class="flex flex-col justify-center items-center py-20">
                <div class="loader ease-linear rounded-full border-4 border-t-4 border-slate-700 h-16 w-16 mb-4"></div>
                <p class="text-cyan-400 font-semibold animate-pulse">Menghitung Trafik Spreadsheet CBT...</p>
            </div>

            <div class="overflow-x-auto hidden" id="tableContainer">
                <table class="min-w-full text-left whitespace-nowrap">
                    <thead>
                        <tr class="bg-slate-800/80 text-slate-300 text-xs uppercase tracking-wider">
                            <th class="py-4 px-6 font-bold">Rank</th>
                            <th class="py-4 px-6 font-bold">Klien / Sekolah</th>
                            <th class="py-4 px-6 font-bold text-center">Trafik Metriks</th>
                            <th class="py-4 px-6 font-bold">Terakhir Aktif</th>
                            <th class="py-4 px-6 font-bold text-center">Intervensi</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody" class="divide-y divide-slate-700/50 text-sm">
                        <!-- Data Injected Here -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        // MASUKKAN URL DEPLOY BARU DI SINI
        const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycby8K_paLuHOkxou0-DSk3sYRZIou8i08bzGHG4rNZbL_n44Z7KzZl6PkIR9nlGxajhrfQ/exec';

        async function fetchData() {
            document.getElementById('loader').classList.remove('hidden');
            document.getElementById('tableContainer').classList.add('hidden');
            
            try {
                const response = await fetch(APPS_SCRIPT_URL);
                const result = await response.json();
                
                if (result.status === 'success') {
                    renderTable(result.data);
                }
            } catch (error) {
                console.error("Fetch Error:", error);
                alert("Gagal mengambil data dari Google Sheet.");
                document.getElementById('loader').classList.add('hidden');
            }
        }

        function renderTable(data) {
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';
            
            let tUsers = 0, tExams = 0, tResults = 0;

            data.forEach((row, index) => {
                // Kalkulasi akumulasi global
                tUsers += row.users;
                tExams += row.exams;
                tResults += row.results;

                // Styling Rank
                let rankVisual = `<span class="bg-slate-700 text-slate-300 font-black py-1 px-3 rounded-lg">${row.peringkat}</span>`;
                if (index === 0) rankVisual = `<span class="bg-gradient-to-r from-yellow-400 to-amber-500 text-slate-900 shadow-[0_0_15px_rgba(251,191,36,0.5)] font-black py-1 px-3 rounded-lg text-lg animate-pulse">👑 1</span>`;
                else if (index === 1) rankVisual = `<span class="bg-gradient-to-r from-slate-300 to-slate-400 text-slate-900 shadow-[0_0_15px_rgba(203,213,225,0.4)] font-black py-1 px-3 rounded-lg text-md">2</span>`;
                else if (index === 2) rankVisual = `<span class="bg-gradient-to-r from-orange-400 to-orange-600 text-white shadow-[0_0_15px_rgba(249,115,22,0.4)] font-black py-1 px-3 rounded-lg text-md">3</span>`;

                // Status Data Sheet
                let statusAkses = row.aksesValid ? `<i class="fas fa-check-circle text-emerald-400"></i>` : `<i class="fas fa-exclamation-triangle text-rose-500" title="Gagal akses Sheet"></i>`;

                // Pesan WhatsApp Follow Up yang tajam
                let waMessage = `Halo admin ${row.sekolah}, dari pantauan sistem CBT kami, tercatat ada ${row.users} Peserta, ${row.exams} Soal, dan ${row.results} Data Hasil Ujian. Apakah progres kelancaran ujian saat ini aman? Jika butuh *update system* atau kendala server, mohon informasikan ke kami. Terima kasih.`;
                if(row.trafficScore === 0) {
                    waMessage = `Halo admin ${row.sekolah}, dari pantauan sistem, aplikasi CBT-nya belum terlihat ada aktivitas (Siswa/Soal kosong). Apakah ada kesulitan dalam menggunakan sistemnya? Mari kami bantu pandu pengaturannya.`;
                }
                const waLink = `https://wa.me/${row.contact}?text=${encodeURIComponent(waMessage)}`;

                const tr = document.createElement('tr');
                tr.className = 'hover:bg-slate-800/80 transition-colors duration-200 group';
                
                tr.innerHTML = `
                    <td class="py-4 px-6">${rankVisual}</td>
                    <td class="py-4 px-6">
                        <div class="font-bold text-white text-base">${row.sekolah}</div>
                        <div class="text-xs text-slate-400 mt-1 flex items-center gap-1">
                            ${statusAkses} Status: <span class="${row.status.toLowerCase() === 'aktif' ? 'text-cyan-400' : 'text-rose-400'}">${row.status}</span>
                        </div>
                    </td>
                    <td class="py-4 px-6">
                        <div class="flex justify-center gap-2">
                            <div class="bg-indigo-900/60 border border-indigo-500/30 px-3 py-1 rounded-md text-center" title="Peserta">
                                <i class="fas fa-user text-indigo-400 text-xs block mb-1"></i>
                                <span class="font-bold text-indigo-200">${row.users}</span>
                            </div>
                            <div class="bg-fuchsia-900/60 border border-fuchsia-500/30 px-3 py-1 rounded-md text-center" title="Soal Ujian">
                                <i class="fas fa-file-alt text-fuchsia-400 text-xs block mb-1"></i>
                                <span class="font-bold text-fuchsia-200">${row.exams}</span>
                            </div>
                            <div class="bg-emerald-900/60 border border-emerald-500/30 px-3 py-1 rounded-md text-center" title="Hasil Nilai">
                                <i class="fas fa-chart-line text-emerald-400 text-xs block mb-1"></i>
                                <span class="font-bold text-emerald-200">${row.results}</span>
                            </div>
                        </div>
                    </td>
                    <td class="py-4 px-6">
                        <span class="bg-slate-800 text-slate-300 border border-slate-600 px-3 py-1 rounded-full text-xs font-semibold font-mono">
                            ${row.lastUpdated}
                        </span>
                    </td>
                    <td class="py-4 px-6 text-center">
                        <a href="${waLink}" target="_blank" class="inline-flex items-center justify-center bg-emerald-500/10 hover:bg-emerald-500 border border-emerald-500 text-emerald-400 hover:text-white transition-all duration-300 py-2 px-4 rounded-xl font-bold text-sm shadow-[0_0_10px_rgba(16,185,129,0.2)] hover:shadow-[0_0_20px_rgba(16,185,129,0.6)]">
                            <i class="fab fa-whatsapp text-lg mr-2"></i> Tanyakan Progres
                        </a>
                    </td>
                `;
                tbody.appendChild(tr);
            });

            // Update Statistik Top Cards
            document.getElementById('totalKlien').innerText = data.length;
            document.getElementById('globalUsers').innerText = tUsers.toLocaleString('id-ID');
            document.getElementById('globalExams').innerText = tExams.toLocaleString('id-ID');
            document.getElementById('globalResults').innerText = tResults.toLocaleString('id-ID');

            document.getElementById('loader').classList.add('hidden');
            document.getElementById('tableContainer').classList.remove('hidden');
        }

        window.onload = fetchData;
    </script>
</body>
</html>
