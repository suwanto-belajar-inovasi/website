<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Keuangan Keluarga</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <style>
        /* Desain Latar Belakang Keluarga & Modern */
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background: linear-gradient(135deg, #fdfbfb 0%, #ebedee 100%);
            min-height: 100vh;
            color: #333;
        }
        .card { 
            border: none; 
            border-radius: 16px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.04); 
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            transition: transform 0.2s ease;
        }
        .card:hover { transform: translateY(-2px); }
        .nav-pills .nav-link.active { 
            background-color: #0d6efd; 
            border-radius: 12px; 
            box-shadow: 0 4px 15px rgba(13, 110, 253, 0.3);
        }
        .nav-link { color: #6c757d; font-weight: 600; border-radius: 12px; }
        .form-control, .form-select { border-radius: 10px; padding: 12px 15px; background-color: #f8f9fa; border: 1px solid #e9ecef; }
        .form-control:focus, .form-select:focus { box-shadow: none; border-color: #0d6efd; }
        .btn-primary { border-radius: 10px; padding: 12px; font-weight: 600; box-shadow: 0 4px 15px rgba(13, 110, 253, 0.3); }
        .loading-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255,255,255,0.8); z-index: 9999; justify-content: center; align-items: center; backdrop-filter: blur(5px); }
        .title-header { font-weight: 800; letter-spacing: -0.5px; }
    </style>
</head>
<body>

<div class="loading-overlay" id="loader">
    <div class="spinner-border text-primary" role="status" style="width: 3rem; height: 3rem;">
        <span class="visually-hidden">Memproses...</span>
    </div>
</div>

<div class="container py-5 max-w-100">
    <h3 class="title-header mb-4">Aplikasi Budgeting 💰</h3>
    
    <ul class="nav nav-pills mb-4 gap-2" id="myTab" role="tablist">
        <li class="nav-item" role="presentation">
            <button class="nav-link active" id="dashboard-tab" data-bs-toggle="pill" data-bs-target="#dashboard" type="button"><i class="bi bi-grid-fill me-2"></i>Dashboard</button>
        </li>
        <li class="nav-item" role="presentation">
            <button class="nav-link" id="input-tab" data-bs-toggle="pill" data-bs-target="#input-transaksi" type="button"><i class="bi bi-pencil-square me-2"></i>Catat Transaksi</button>
        </li>
        <li class="nav-item" role="presentation">
            <button class="nav-link" id="setting-tab" data-bs-toggle="pill" data-bs-target="#pengaturan" type="button"><i class="bi bi-gear-fill me-2"></i>Pengaturan</button>
        </li>
    </ul>

    <div class="tab-content" id="myTabContent">
        
        <div class="tab-pane fade show active" id="dashboard" role="tabpanel">
            <div class="row g-4 mb-4">
                <div class="col-md-4">
                    <div class="card bg-primary text-white p-4 h-100" style="background: linear-gradient(135deg, #0d6efd 0%, #0043a8 100%);">
                        <p class="mb-1 opacity-75 fw-medium">Total Saldo (Keseluruhan)</p>
                        <h2 class="fw-bold mb-0" id="txtSaldo">Rp 0</h2>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="card text-white p-4 h-100" style="background: linear-gradient(135deg, #198754 0%, #0f5132 100%);">
                        <p class="mb-1 opacity-75 fw-medium">Pemasukan (<span class="lblPeriode">Bulan Ini</span>)</p>
                        <h3 class="fw-bold mb-0" id="txtMasuk">Rp 0</h3>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="card text-white p-4 h-100" style="background: linear-gradient(135deg, #dc3545 0%, #842029 100%);">
                        <p class="mb-1 opacity-75 fw-medium">Pengeluaran (<span class="lblPeriode">Bulan Ini</span>)</p>
                        <h3 class="fw-bold mb-0" id="txtKeluar">Rp 0</h3>
                    </div>
                </div>
            </div>

            <div class="card p-4">
                <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-3">
                    <h5 class="fw-bold mb-0">Tren Pemasukan & Pengeluaran</h5>
                    <select class="form-select w-auto fw-medium shadow-sm" id="chartFilter" onchange="applyFilter()">
                        <option value="mingguan">Mingguan (7 Hari Terakhir)</option>
                        <option value="bulanan" selected>Bulanan (Bulan Ini)</option>
                        <option value="tahunan">Tahunan (Tahun Ini)</option>
                    </select>
                </div>
                
                <div class="row g-4">
                    <div class="col-lg-5">
                        <div class="p-3 border rounded-4 bg-light">
                            <canvas id="barChart" height="250"></canvas>
                        </div>
                    </div>
                    <div class="col-lg-7">
                        <div class="p-3 border rounded-4 bg-light">
                            <canvas id="lineChart" height="175"></canvas>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="tab-pane fade" id="input-transaksi" role="tabpanel">
            <div class="card p-4">
                <h5 class="fw-bold mb-4">Catat Transaksi Baru</h5>
                <form id="formTransaksi">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label fw-medium">Jenis Transaksi</label>
                            <select class="form-select" id="jenis" required onchange="updateKategoriDropdown()">
                                <option value="">Pilih Jenis...</option>
                                <option value="Pemasukan">Pemasukan</option>
                                <option value="Pengeluaran">Pengeluaran</option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-medium">Tanggal Transaksi</label>
                            <input type="date" class="form-control" id="tglTransaksi" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-medium">Kategori / Tujuan</label>
                            <select class="form-select" id="kategori" required>
                                <option value="">Pilih Jenis Transaksi Dulu</option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-medium">Rekening / Pembayaran</label>
                            <select class="form-select" id="rekening" required></select>
                        </div>
                        <div class="col-md-12">
                            <label class="form-label fw-medium">Nominal (Rp)</label>
                            <input type="number" class="form-control" id="nominal" placeholder="Contoh: 150000" required>
                        </div>
                        <div class="col-md-12">
                            <label class="form-label fw-medium">Uraian / Keterangan</label>
                            <textarea class="form-control" id="uraian" rows="2" placeholder="Tulis rincian di sini..."></textarea>
                        </div>
                        <div class="col-12 mt-4">
                            <button type="submit" class="btn btn-primary w-100">Simpan Transaksi</button>
                        </div>
                    </div>
                </form>
            </div>
        </div>

        <div class="tab-pane fade" id="pengaturan" role="tabpanel">
            <div class="card p-4">
                <h5 class="fw-bold mb-4">Tambah Master Data</h5>
                <form id="formMaster">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label fw-medium">Tipe Data</label>
                            <select class="form-select" id="tipeMaster" required>
                                <option value="Kategori_Pemasukan">Kategori Pemasukan</option>
                                <option value="Kategori_Pengeluaran">Kategori Pengeluaran</option>
                                <option value="Rekening">Rekening Pembayaran</option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-medium">Nama Item Baru</label>
                            <input type="text" class="form-control" id="namaItem" required>
                        </div>
                        <div class="col-12 mt-4">
                            <button type="submit" class="btn btn-dark w-100" style="border-radius: 10px; padding: 12px; font-weight: 600;">Tambahkan ke Database</button>
                        </div>
                    </div>
                </form>
            </div>
        </div>

    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    // GANTI DENGAN URL WEB APP APPS SCRIPT ANDA
    const API_URL = 'https://script.google.com/macros/s/AKfycbw6ygPQpUZxJpYPYcJspMyg7827FmbaNq5UTPCQx26L8N8eDuPhlgWbwo1DRp0mghxr/exec';
    
    let masterDataCache = {};
    let allTransactions = [];
    let barChartInstance = null;
    let lineChartInstance = null;
    let globalSaldo = 0;

    document.addEventListener("DOMContentLoaded", () => {
        document.getElementById('tglTransaksi').valueAsDate = new Date();
        fetchDataMaster();
        fetchDashboard();
    });

    function showLoader(show) {
        document.getElementById('loader').style.display = show ? 'flex' : 'none';
    }

    async function fetchDataMaster() {
        try {
            const response = await fetch(`${API_URL}?action=getMasterData`);
            masterDataCache = await response.json();
            const rekSelect = document.getElementById('rekening');
            rekSelect.innerHTML = '<option value="">Pilih Rekening...</option>';
            masterDataCache.Rekening.forEach(r => rekSelect.innerHTML += `<option value="${r}">${r}</option>`);
        } catch (error) {
            console.error(error);
        }
    }

    async function fetchDashboard() {
        showLoader(true);
        try {
            const response = await fetch(`${API_URL}?action=getDashboardData`);
            const data = await response.json();
            
            allTransactions = data.transactions;
            globalSaldo = data.saldoKeseluruhan;
            document.getElementById('txtSaldo').innerText = 'Rp ' + globalSaldo.toLocaleString('id-ID');
            
            applyFilter(); // Panggil filter untuk generate grafik
        } catch (error) {
            console.error(error);
        }
        showLoader(false);
    }

    // Logika Filter Data Waktu Dinamis
    function applyFilter() {
        const filter = document.getElementById('chartFilter').value;
        const now = new Date();
        let currentMonth = now.getMonth();
        let currentYear = now.getFullYear();
        
        let dataMap = {};
        let lblPeriode = "";

        // Buat Template Map Kosong agar grafik rapi meskipun hari/bulan itu kosong
        if (filter === 'mingguan') {
            lblPeriode = "7 Hari Terakhir";
            for (let i = 6; i >= 0; i--) {
                let d = new Date();
                d.setDate(d.getDate() - i);
                let key = d.toISOString().split('T')[0];
                dataMap[key] = { masuk: 0, keluar: 0, label: d.toLocaleDateString('id-ID', {weekday:'short', day:'numeric'}) };
            }
        } else if (filter === 'bulanan') {
            lblPeriode = "Bulan Ini";
            let daysInMonth = new Date(currentYear, currentMonth + 1, 0).getDate();
            for (let i = 1; i <= daysInMonth; i++) {
                let key = `${currentYear}-${String(currentMonth+1).padStart(2,'0')}-${String(i).padStart(2,'0')}`;
                dataMap[key] = { masuk: 0, keluar: 0, label: i.toString() };
            }
        } else if (filter === 'tahunan') {
            lblPeriode = "Tahun Ini";
            for (let i = 0; i < 12; i++) {
                let key = i.toString();
                let monthLabel = new Date(currentYear, i, 1).toLocaleDateString('id-ID', {month:'short'});
                dataMap[key] = { masuk: 0, keluar: 0, label: monthLabel };
            }
        }

        // Hitung Total Berdasarkan Filter
        let totalMasuk = 0;
        let totalKeluar = 0;

        allTransactions.forEach(tx => {
            // Coba parsing tanggal dengan aman
            let d = new Date(tx.tanggal);
            // Fallback jika format Indonesia DD/MM/YYYY
            if(isNaN(d.getTime()) && tx.tanggal.includes('/')) {
                let parts = tx.tanggal.split('/');
                d = new Date(parts[2], parts[1]-1, parts[0]);
            }
            if(isNaN(d.getTime())) return;

            let txMonth = d.getMonth();
            let txYear = d.getFullYear();
            let txDateStr = d.toISOString().split('T')[0];
            let nominal = parseFloat(tx.nominal) || 0;
            
            let key = '';
            if (filter === 'mingguan' && dataMap[txDateStr]) {
                key = txDateStr;
            } else if (filter === 'bulanan' && txYear === currentYear && txMonth === currentMonth) {
                key = txDateStr;
            } else if (filter === 'tahunan' && txYear === currentYear) {
                key = txMonth.toString();
            }

            if (dataMap[key]) {
                if (tx.jenis === 'Pemasukan') {
                    dataMap[key].masuk += nominal;
                    totalMasuk += nominal;
                } else if (tx.jenis === 'Pengeluaran') {
                    dataMap[key].keluar += nominal;
                    totalKeluar += nominal;
                }
            }
        });

        // Update Teks Label pada Kartu
        document.querySelectorAll('.lblPeriode').forEach(el => el.innerText = lblPeriode);
        document.getElementById('txtMasuk').innerText = 'Rp ' + totalMasuk.toLocaleString('id-ID');
        document.getElementById('txtKeluar').innerText = 'Rp ' + totalKeluar.toLocaleString('id-ID');

        // Susun array untuk Chart.js
        let labels = [], masukArr = [], keluarArr = [];
        Object.values(dataMap).forEach(val => {
            labels.push(val.label);
            masukArr.push(val.masuk);
            keluarArr.push(val.keluar);
        });

        renderCharts(labels, masukArr, keluarArr, totalMasuk, totalKeluar);
    }

    function renderCharts(labels, masukArr, keluarArr, totalMasuk, totalKeluar) {
        Chart.defaults.font.family = "'Plus Jakarta Sans', sans-serif";
        
        // --- 1. BAR CHART (KIRI) : Total Perbandingan ---
        const ctxBar = document.getElementById('barChart').getContext('2d');
        if(barChartInstance) barChartInstance.destroy();
        
        barChartInstance = new Chart(ctxBar, {
            type: 'bar',
            data: {
                labels: ['Total Periode Ini'],
                datasets: [
                    { label: 'Pemasukan', data: [totalMasuk], backgroundColor: '#198754', borderRadius: 8 },
                    { label: 'Pengeluaran', data: [totalKeluar], backgroundColor: '#dc3545', borderRadius: 8 }
                ]
            },
            options: { 
                responsive: true, 
                maintainAspectRatio: false,
                plugins: { legend: { position: 'bottom' }, tooltip: { callbacks: { label: (ctx) => 'Rp ' + ctx.raw.toLocaleString('id-ID') } } },
                scales: { y: { beginAtZero: true, display: false }, x: { grid: { display: false } } }
            }
        });

        // --- 2. LINE CHART (KANAN) : Grafik Garis Kurva Tren ---
        const ctxLine = document.getElementById('lineChart').getContext('2d');
        if(lineChartInstance) lineChartInstance.destroy();
        
        lineChartInstance = new Chart(ctxLine, {
            type: 'line',
            data: {
                labels: labels,
                datasets: [
                    { 
                        label: 'Pemasukan', 
                        data: masukArr, 
                        borderColor: '#198754', 
                        backgroundColor: 'rgba(25, 135, 84, 0.1)',
                        borderWidth: 3,
                        tension: 0.4, // Membuat garis melengkung (Kurva)
                        fill: true
                    },
                    { 
                        label: 'Pengeluaran', 
                        data: keluarArr, 
                        borderColor: '#dc3545',
                        backgroundColor: 'rgba(220, 53, 69, 0.1)',
                        borderWidth: 3, 
                        tension: 0.4, // Membuat garis melengkung (Kurva)
                        fill: true
                    }
                ]
            },
            options: { 
                responsive: true, 
                maintainAspectRatio: false,
                plugins: { legend: { position: 'bottom' }, tooltip: { mode: 'index', intersect: false, callbacks: { label: (ctx) => 'Rp ' + ctx.raw.toLocaleString('id-ID') } } },
                scales: { 
                    y: { beginAtZero: true, grid: { borderDash: [5, 5] }, ticks: { callback: (val) => 'Rp ' + (val/1000) + 'k' } },
                    x: { grid: { display: false } }
                },
                interaction: { mode: 'nearest', axis: 'x', intersect: false }
            }
        });
    }

    function updateKategoriDropdown() {
        const jenis = document.getElementById('jenis').value;
        const katSelect = document.getElementById('kategori');
        katSelect.innerHTML = '<option value="">Pilih Kategori...</option>';
        
        const kunci = jenis === 'Pemasukan' ? 'Kategori_Pemasukan' : (jenis === 'Pengeluaran' ? 'Kategori_Pengeluaran' : null);
        
        if (kunci && masterDataCache[kunci]) {
            masterDataCache[kunci].forEach(k => katSelect.innerHTML += `<option value="${k}">${k}</option>`);
        }
    }

    // Submit Transaksi
    document.getElementById('formTransaksi').addEventListener('submit', async (e) => {
        e.preventDefault();
        showLoader(true);
        
        const payload = {
            action: 'simpanTransaksi',
            jenis: document.getElementById('jenis').value,
            tglTransaksi: document.getElementById('tglTransaksi').value,
            kategori: document.getElementById('kategori').value,
            rekening: document.getElementById('rekening').value,
            nominal: document.getElementById('nominal').value,
            uraian: document.getElementById('uraian').value
        };

        try {
            const response = await fetch(API_URL, { method: 'POST', body: JSON.stringify(payload) });
            const resData = await response.json();
            
            if (resData.status === 'success') {
                Swal.fire({ title: 'Berhasil!', text: resData.message, icon: 'success', confirmButtonColor: '#0d6efd' });
                document.getElementById('formTransaksi').reset();
                document.getElementById('tglTransaksi').valueAsDate = new Date();
                fetchDashboard(); 
            }
        } catch (error) {
            Swal.fire({ title: 'Oops...', text: 'Koneksi gagal atau terjadi kesalahan.', icon: 'error' });
        } finally {
            showLoader(false);
        }
    });

    // Submit Master
    document.getElementById('formMaster').addEventListener('submit', async (e) => {
        e.preventDefault();
        showLoader(true);
        
        const payload = {
            action: 'simpanMaster',
            tipe: document.getElementById('tipeMaster').value,
            namaItem: document.getElementById('namaItem').value
        };

        try {
            const response = await fetch(API_URL, { method: 'POST', body: JSON.stringify(payload) });
            const resData = await response.json();
            
            if (resData.status === 'success') {
                Swal.fire({ title: 'Sip!', text: resData.message, icon: 'success', confirmButtonColor: '#212529' });
                document.getElementById('namaItem').value = '';
                fetchDataMaster(); 
            }
        } catch (error) {
            Swal.fire({ title: 'Oops...', text: 'Gagal menambah master data.', icon: 'error' });
        } finally {
            showLoader(false);
        }
    });
</script>
</body>
</html>
