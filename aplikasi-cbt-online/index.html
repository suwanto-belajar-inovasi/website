<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal CBT Belajar Inovasi</title>
    
    <!-- Bootstrap & Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

    <style>
        body { 
            font-family: 'Poppins', sans-serif; 
            background: linear-gradient(135deg, #0ea5e9 0%, #1e3a8a 100%); 
            min-height: 100vh; display: flex; align-items: center; justify-content: center; 
        }
        .auth-card { 
            background: white; border-radius: 20px; box-shadow: 0 20px 50px rgba(0,0,0,0.3); 
            width: 100%; max-width: 450px; padding: 40px; 
        }
        .hidden { display: none !important; }
        .spinner { width: 1.5rem; height: 1.5rem; border: 3px solid rgba(255,255,255,0.3); border-radius: 50%; border-top-color: white; animation: spin 1s ease-in-out infinite; display: inline-block; margin-right: 5px; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

<!-- KOTAK LOGIN -->
<div class="auth-card" id="card-login">
    <div class="text-center mb-4">
        <h4 class="fw-bold text-primary">PORTAL UJIAN CBT</h4>
        <p class="text-muted small">Login menggunakan Kode Lembaga Anda.</p>
    </div>
    
    <form id="frm-login" onsubmit="handleLogin(event)">
        <div class="form-floating mb-3">
            <input type="text" id="log-kode" class="form-control" placeholder="CBT1234" required>
            <label>Kode Lembaga</label>
        </div>
        <div class="form-floating mb-3">
            <input type="text" id="log-user" class="form-control" placeholder="User" required>
            <label>Username</label>
        </div>
        <div class="form-floating mb-4 position-relative">
            <input type="password" id="log-pass" class="form-control" placeholder="Pass" required>
            <label>Password</label>
        </div>
        <button type="submit" id="btn-login" class="btn btn-primary w-100 py-3 fw-bold shadow-sm">MASUK SEKARANG</button>
        <p class="text-center mt-3 mb-0 small">Belum mendaftar? <a href="#" onclick="toggleView()" class="fw-bold text-decoration-none">Buat Database Baru</a></p>
    </form>
</div>

<!-- KOTAK REGISTRASI -->
<div class="auth-card hidden" id="card-register">
    <div class="text-center mb-4">
        <h4 class="fw-bold text-success">DAFTAR LEMBAGA</h4>
        <p class="text-muted small">Akses login akan dikirimkan otomatis ke WhatsApp Anda.</p>
    </div>
    
    <form id="frm-reg" onsubmit="handleRegister(event)">
        <div class="form-floating mb-3">
            <input type="text" id="reg-nama" class="form-control" placeholder="Nama Sekolah" required>
            <label>Nama Sekolah / Instansi</label>
        </div>
        <div class="form-floating mb-3">
            <input type="number" id="reg-wa" class="form-control" placeholder="0812xxxx" required>
            <label>No WhatsApp Aktif (Mulai dgn 08..)</label>
        </div>
        <div class="form-floating mb-3">
            <input type="text" id="reg-user" class="form-control" placeholder="Admin" required>
            <label>Buat Username Admin</label>
        </div>
        <div class="form-floating mb-4">
            <input type="password" id="reg-pass" class="form-control" placeholder="Password" required>
            <label>Buat Password Admin</label>
        </div>
        <button type="submit" id="btn-reg" class="btn btn-success w-100 py-3 fw-bold shadow-sm">DAFTAR & BUAT SERVER</button>
        <p class="text-center mt-3 mb-0 small"><a href="#" onclick="toggleView()" class="text-muted text-decoration-none">Kembali ke Login</a></p>
    </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script>
    // =========================================================
    // PASTIKAN MENGGANTI URL DI BAWAH DENGAN URL DEPLOY TERBARU
    // =========================================================
    const API_URL = 'https://script.google.com/macros/s/AKfycbxrBL7pCDPgvqNQIeOFezQjjZ0rZag77ksXHoHUuE2LcTIjCBadYwaaIW02ML_2JKadKQ/exec'; 

    function toggleView() {
        document.getElementById('card-login').classList.toggle('hidden');
        document.getElementById('card-register').classList.toggle('hidden');
    }

    // Fungsi Mendaftar
    async function handleRegister(e) {
        e.preventDefault();
        const btn = document.getElementById('btn-reg');
        const nama = document.getElementById('reg-nama').value;
        const wa = document.getElementById('reg-wa').value;
        const user = document.getElementById('reg-user').value;
        const pass = document.getElementById('reg-pass').value;

        btn.disabled = true;
        btn.innerHTML = `<span class="spinner"></span> Memproses...`;

        const formData = new URLSearchParams();
        formData.append('action', 'register');
        formData.append('nama', nama);
        formData.append('whatsapp', wa);
        formData.append('adminUser', user);
        formData.append('adminPass', pass);

        try {
            const response = await fetch(API_URL, {
                method: 'POST',
                body: formData
            });
            const resData = await response.json();

            if (resData.status === 'success') {
                Swal.fire({
                    title: 'Pendaftaran Berhasil!',
                    html: `Sistem sedang mengirimkan Kode Lembaga dan akses login ke WhatsApp Anda (<b>${wa}</b>).<br><br><small class="text-muted">Jika belum masuk, tunggu beberapa saat atau cek kembali nomor Anda.</small>`,
                    icon: 'success',
                    confirmButtonText: 'Lanjut Login'
                }).then(() => {
                    // Isi form login otomatis dengan data yang baru dibuat
                    document.getElementById('log-kode').value = resData.kode;
                    document.getElementById('log-user').value = user;
                    document.getElementById('log-pass').value = pass;
                    toggleView();
                });
            } else {
                Swal.fire('Gagal', resData.msg, 'error');
            }
        } catch (err) {
            Swal.fire('Error', 'Gagal menghubungi server.', 'error');
        } finally {
            btn.disabled = false;
            btn.innerHTML = `DAFTAR & BUAT SERVER`;
        }
    }

    // Fungsi Login
    async function handleLogin(e) {
        e.preventDefault();
        const btn = document.getElementById('btn-login');
        const kode = document.getElementById('log-kode').value;
        const user = document.getElementById('log-user').value;
        const pass = document.getElementById('log-pass').value;

        btn.disabled = true;
        btn.innerHTML = `<span class="spinner"></span> Mengecek Data...`;

        const formData = new URLSearchParams();
        formData.append('action', 'login');
        formData.append('kode', kode);
        formData.append('username', user);
        formData.append('password', pass);

        try {
            const response = await fetch(API_URL, {
                method: 'POST',
                body: formData
            });
            const resData = await response.json();

            if (resData.status === 'success') {
                localStorage.setItem('cbt_user_session', JSON.stringify(resData.data));
                
                Swal.fire({
                    icon: 'success',
                    title: 'Login Berhasil',
                    showConfirmButton: false,
                    timer: 1500
                }).then(() => {
                    window.location.href = 'dashboard.html'; 
                });
            } else {
                Swal.fire('Gagal', resData.msg, 'error');
            }
        } catch (err) {
            Swal.fire('Error', 'Gagal menghubungi server.', 'error');
        } finally {
            btn.disabled = false;
            btn.innerHTML = `MASUK SEKARANG`;
        }
    }
</script>

</body>
</html>
